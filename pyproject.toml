[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-backup-deck"
dynamic = ["version"]
description = "GIF Picker-family graphical GitHub backup manager for Wayland"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "madebycli" }]
keywords = ["github", "backup", "gtk", "layer-shell", "wayland", "nixos"]

[project.scripts]
github-backup-deck = "github_backup_deck.cli:main"
github-backup-deck-daemon = "github_backup_deck.daemon:main"
github-backup-deck-overview = "github_backup_deck.gui.overview:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { file = ["src/github_backup_deck/VERSION"] }

[tool.setuptools.package-data]
github_backup_deck = ["VERSION"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP035", "UP037", "SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["github_backup_deck"]
mypy_path = "src"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "github_backup_deck.gui.main_window",
  "github_backup_deck.gui.login_dialog",
  "github_backup_deck.gui.storage_dialog",
]
disable_error_code = ["name-defined", "misc", "has-type"]
