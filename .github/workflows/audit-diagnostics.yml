name: Audit diagnostics

on:
  push:
    branches:
      - audit/stability-hardening-0.3.0

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Capture Python diagnostics
        shell: bash
        run: |
          set +e
          nix develop --command bash -lc '
            export PYTHONPATH="$PWD/src"
            {
              echo "=== PYTEST ==="
              pytest -q
              echo "pytest_exit=$?"
              echo "=== RUFF ==="
              ruff check .
              echo "ruff_exit=$?"
              echo "=== MYPY ==="
              mypy src
              echo "mypy_exit=$?"
            } > audit-diagnostics.txt 2>&1
          '
          test -f audit-diagnostics.txt
      - name: Capture complete Nix check log
        shell: bash
        run: |
          set +e
          nix flake check --print-build-logs > nix-check.txt 2>&1
          printf '\nnix_exit=%s\n' "$?" >> nix-check.txt
          test -f nix-check.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-diagnostics
          path: |
            audit-diagnostics.txt
            nix-check.txt
          if-no-files-found: error
          retention-days: 1
