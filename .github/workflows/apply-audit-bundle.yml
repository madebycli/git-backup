name: Apply audit bundle

on:
  push:
    branches:
      - audit/stability-hardening-0.3.0
    paths:
      - .github/workflows/apply-audit-bundle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit/stability-hardening-0.3.0
          fetch-depth: 0
      - name: Apply and validate bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .audit/chunk-*.b64 | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/audit.tar.gz"
          tar -xzf "$RUNNER_TEMP/audit.tar.gz" -C .
          rm -rf .audit tmp-placeholder
          python3 -m compileall -q src
      - name: Publish audited branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: apply preventive stability hardening 0.3.0'
          git push origin HEAD:audit/stability-hardening-0.3.0
