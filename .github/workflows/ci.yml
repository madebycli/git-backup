name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Validate flake
        run: |
          set -euo pipefail
          nix flake show
          nix flake check --print-build-logs
      - name: Build and smoke-test package
        run: |
          set -euo pipefail
          nix build .#github-backup-deck --print-build-logs
          nix run .#github-backup-deck -- doctor | grep -q '"ok": true'
