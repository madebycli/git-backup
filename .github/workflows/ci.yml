name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Verify committed lock file
        run: |
          set -euo pipefail
          nix flake lock
          git diff --exit-code -- flake.lock

      - name: Validate flake
        run: |
          set -euo pipefail
          nix flake show --no-write-lock-file
          nix flake check --no-write-lock-file --print-build-logs

      - name: Build and smoke-test package
        run: |
          set -euo pipefail
          nix build .#github-backup-deck --no-write-lock-file --print-build-logs
          nix run .#github-backup-deck --no-write-lock-file -- doctor | grep -q '"ok": true'

      - name: Verify direct GitHub profile install
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIRECT_PROFILE: ${{ runner.temp }}/github-backup-deck-profile
        run: |
          set -euo pipefail
          nix profile add --profile "$DIRECT_PROFILE" \
            "github:${GITHUB_REPOSITORY}#github-backup-deck"
          test -x "$DIRECT_PROFILE/bin/github-backup-deck"
          "$DIRECT_PROFILE/bin/github-backup-deck" --version
